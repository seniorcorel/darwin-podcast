name: Update Podcast RSS Feed

on:
  schedule:
    # Lunes a Viernes a las 15:00 UTC y 18:00 UTC (12:00 y 15:00 hora Uruguay)
    - cron: '0 15,18 * * 1-5'
  workflow_dispatch: # Permite ejecutar manualmente con un clic en GitHub

permissions:
  contents: write

jobs:
  build-and-update:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Generate Podcast Feed
        run: |
          python generate_feed.py

      - name: Commit and push changes
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add feed.xml lengths_cache.json
          if git diff --staged --quiet; then
            echo "No hay nuevos episodios, feed al día."
          else
            git commit -m "chore: actualizar episodios podcast Darwin [skip ci]"
            git push
          fi
